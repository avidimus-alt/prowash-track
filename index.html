<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROWASH TRACK</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="logo-prowash.jpeg" alt="PROWASH GUYANE" class="login-logo" />
      <h1>PROWASH <span>TRACK</span></h1>
      <p>Connexion réservée aux employés autorisés</p>
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="loginPassword" type="password" placeholder="Mot de passe" autocomplete="current-password" />
      <button id="loginBtn">Se connecter</button>
      <button id="forgotBtn" class="link-btn" type="button">Mot de passe oublié ?</button>
      <small id="loginMessage"></small>
    </div>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><img src="logo-prowash.jpeg" alt="PROWASH GUYANE" /></div>
      <nav>
        <button class="menu-btn active" data-page="dashboard">🏠 Dashboard</button>
        <button class="menu-btn" data-page="missions">📋 Missions</button>
        <button class="menu-btn" data-page="new-mission">➕ Nouvelle mission</button>
        <button class="menu-btn" data-page="employees">👷 Employés</button>
        <button class="menu-btn" data-page="clients">👥 Clients</button>
        <button class="menu-btn" data-page="stats">📊 Statistiques</button>
        <button class="menu-btn" data-page="settings">⚙️ Paramètres</button>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1>PROWASH <span>TRACK</span></h1><p>Gestion des activités et interventions</p></div>
        <div class="user-card">
          <div id="userAvatar" class="avatar">A</div>
          <div><strong id="userName">Utilisateur</strong><small id="userEmail"></small></div>
          <button id="logoutBtn">Déconnexion</button>
        </div>
      </header>
      <section id="pageContent"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
